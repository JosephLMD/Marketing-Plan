<script>
function qrShow(){document.getElementById('qrOv').classList.add('on');
  document.body.style.overflow='hidden';
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});}
function qrHide(){document.getElementById('qrOv').classList.remove('on');
  document.body.style.overflow='';
  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(function(){});}
document.getElementById('qrOv').addEventListener('click',qrHide);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') qrHide();
  if((e.key==='q'||e.key==='Q')&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))
    document.getElementById('qrOv').classList.contains('on')?qrHide():qrShow();
});
</script>
